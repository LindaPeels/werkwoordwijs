+ t.","w":1,"manual":true}]],["Combinatie van deelwoorden",[{"p":"De ___ (knipperen, onvoltooid) lamp werd vervangen.","a":"knipperende","w":0.5},{"p":"De lamp werd ___ (vervangen).","a":"vervangen","w":0.5},{"p":"De ___ (verhitten, voltooid) pan stond op het fornuis.","a":"verhitte","w":0.5},{"p":"De kok liep ___ (fluiten) door de keuken.","a":"fluitend","w":0.5},{"p":"De ___ (scheuren, voltooid) broek lag op tafel.","a":"gescheurde","w":0.5},{"p":"De broek werd ___ (naaien).","a":"genaaid","w":0.5},{"p":"De kleermaker heeft de broek ___ (repareren).","a":"gerepareerd","w":0.5}]]];const $=id=>document.getElementById(id),rows=[];function el(t,v,p){let e=document.createElement(t);if(v!==undefined)e.textContent=v;if(p)p.append(e);return e}function norm(v){return v.trim().toLowerCase()}function fmt(n){return String(n).replace('.',',')}sections.forEach(([title,items],i)=>{let sec=el('section',undefined,$('paper'));el('h2',(i+1)+'. '+title,sec);el('p',fmt(items.reduce((s,x)=>s+x.w,0))+' punten',sec);items.forEach(x=>{let l=el('label',x.p,sec),input=el(x.manual?'textarea':'input',undefined,l);input.spellcheck=false;input.autocomplete='off';if(x.manual)input.rows=4;let sort;if(x.sort){let l=el('label','Is alleen -en weghalen voldoende?',sec);sort=el('select',undefined,l);for(let v of ['','ja','nee']){let o=el('option',v||'Kies',sort);o.value=v}}rows.push({x,input,sort,group:i,score:0})})});$('paper').onsubmit=e=>e.preventDefault();$('submit').onclick=()=>{if(rows.some(r=>!r.input.value.trim()||(r.sort&&!r.sort.value))&&!confirm('Er zijn lege antwoorden. Toch inleveren?'))return;$('submit').disabled=true;let out=$('results'),summary=el('section',undefined,out),h=el('h2','',summary),p=el('p','',summary),auto=0,manual=[];el('p','Ken zelf punten toe aan de open antwoorden.',summary);for(let row of rows){let {x,input,sort}=row;input.disabled=true;if(sort)sort.disabled=true;let d=el('div',undefined,out);d.className='review';el('strong',x.p,d);el('p','Jouw antwoord: '+input.value+(sort?' / '+sort.value:''),d);el('p','Correctiemodel: '+x.a+(sort?' / '+x.sort:''),d);if(x.manual){let sel=el('select',undefined,d);for(let k=0;k<=x.w;k+=.5){let o=el('option',fmt(k)+' punten',sel);o.value=k}sel.disabled=!input.value.trim();manual.push(sel);row.sel=sel;sel.onchange=update}else{let score=sort?(.25*(norm(input.value)===norm(x.a))+.25*(sort.value===x.sort)):(norm(input.value)===norm(x.a)?x.w:0);auto+=score;row.score=score;el('p',fmt(score)+' / '+fmt(x.w)+' punten',d)}}function grade(score){let r=score/42.5,c=.7,n=r<=c?1+4.5*Math.pow(r/c,1.35):5.5+4.5*Math.pow((r-c)/(1-c),.85);return (r<c?Math.min(5.4,n):n).toFixed(1)}let overview=el('div',undefined,summary);el('h3','Punten per opdracht',overview);let table=el('table',undefined,overview);table.style.cssText='width:100%;border-collapse:collapse';let tr=el('tr',undefined,table);for(let label of ['Opdracht','Behaald','Maximum'])el('th',label,tr);let cells=sections.map(([title,items],i)=>{let tr=el('tr',undefined,table);el('td',(i+1)+'. '+title,tr);let cell=el('td','0',tr);el('td',fmt(items.reduce((a,x)=>a+x.w,0)),tr);return cell});let details=el('details',undefined,summary);el('summary','Bekijk de volledige cijferlijst (punten → cijfer)',details);el('p','70% = 29,75 punten. De cijfers zijn indicatief.',details);let grid=el('div',undefined,details);grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px;max-height:360px;overflow:auto';let grades=[];for(let i=0;i<=170;i++){let points=i/4;let cell=el('div',fmt(points)+' p. → '+fmt(grade(points)),grid);cell.style.padding='5px';grades.push(cell)}function update(){let score=auto+manual.reduce((s,e)=>s+Number(e.value),0),r=score/42.5;h.textContent='Indicatief cijfer: '+fmt(grade(score));p.textContent=fmt(score)+' / 42,5 punten — '+(r>=.7?'voldoende':'onvoldoende');cells.forEach((cell,i)=>cell.textContent=fmt(rows.filter(row=>row.group===i).reduce((a,row)=>a+(row.sel?Number(row.sel.value):row.score),0)));grades.forEach((cell,i)=>{cell.style.fontWeight=i===Math.round(score*4)?'bold':'normal';cell.style.background=i===Math.round(score*4)?'#d5f1e7':''})}update();summary.scrollIntoView();let b=el('button','Opnieuw beginnen',out);b.onclick=()=>location.reload()};</script></html>
